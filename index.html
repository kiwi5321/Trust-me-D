<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Are you sure?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100%; height: 100vh;
      background: #1a1a1a;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; font-family: 'Courier New', monospace;
      transition: background-color .12s;
    }

    #backgroundLayer {
      position: fixed; inset: 0;
      z-index: 1; pointer-events: none; overflow: hidden;
    }

    .ascii-character {
      position: absolute;
      font-family: 'Courier New', monospace;
      white-space: pre;
      user-select: none;
      line-height: 1.05;
      will-change: left, top;
      transform-origin: center;
    }

    .floating-text {
      position: absolute;
      white-space: nowrap;
      font-family: 'Courier New', monospace;
      user-select: none;
      opacity: 0.9;
      z-index: 2;
      pointer-events: none;
      transform-origin: center;
    }

    #buttonContainer {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100; padding: 20px;
    }

    /* RESTORED: original responsive size/padding */
    .trust-btn {
      background: #8b5cf6;
      color: white;
      border: 4px solid white;
      padding: clamp(12px, 4vw, 18px) clamp(24px, 8vw, 40px);
      font-family: 'Courier New', monospace;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: bold;
      border-radius: 0;
      cursor: pointer;
      box-shadow: 6px 6px 0 #4c1d95;
      transition: all 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .trust-btn:hover { transform: translate(3px,3px); box-shadow: 3px 3px 0 #4c1d95; }
    .trust-btn:active { transform: translate(6px,6px); box-shadow: 0 0 0 #4c1d95; }

    #videoContainer {
      position: fixed; top: 50%; left: 50%;
      z-index: 50; display: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 20px rgba(139,92,246,.6));
      padding: 10px; max-width: 95vw; max-height: 95vh;
    }

    #prankVideo {
      width: 100%; height: auto;
      border: 3px solid #8b5cf6; border-radius: 4px;
      display: block;
    }

    #endScreen {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100; display: none; text-align: center;
      background: rgba(26,26,26,0.95);
      padding: 36px; border: 3px solid #8b5cf6; border-radius: 6px;
      max-width: 90vw; max-height: 90vh; overflow-y: auto;
    }

    #endScreen h1 { font-size: clamp(20px, 6vw, 36px); color: #ffd93d; margin-bottom: 12px; }
    #cookieArt { font-family: 'Courier New', monospace; color: #d4a574; white-space: pre; margin: 12px 0; line-height: 1.05; }
    #endScreen p { color: #a8dadc; margin-top: 10px; }

    #colorBeat { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none; transition: background-color .08s; }

    @media (max-width: 768px) {
      .floating-text { font-size: clamp(12px, 3.5vw, 18px); }
      .ascii-character { font-size: clamp(10px, 3.2vw, 14px) !important; }
      body { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div id="backgroundLayer"></div>
  <div id="colorBeat"></div>

  <div id="buttonContainer">
    <button class="trust-btn" id="startBtn">TRUST ME</button>
  </div>

  <div id="videoContainer">
    <video id="prankVideo" loop playsinline>
      <source src="./HEYYEYAAEYAAAEYAEYAA%20(HQ)(3).mp4" type="video/mp4">
    </video>
  </div>

  <div id="endScreen">
    <h1>You watched till the end!</h1>
    <div id="cookieArt"></div>
    <p id="endText">Here's a cookie for watching till the end</p>
  </div>

  <script>
    // cookie ASCII art
    const cookieASCII = `
         .-""""-.
       .'  .--.  '.
      /  .'.--.'.  \\
     |  / /    \\ \\  |
     ; |  |    |  | ;
     | |  |    |  | |
     ; |  '.__.'  | ;
      \\ \\        / /
       '.'.____.'.'
         '-.____.-'
    `;

    const isMobile = () => window.innerWidth <= 768;

    // phrases and dancers (kept small & readable)
    const floatingPhrases = ['HEYYEYAAEYAAAEYAEYAA', "What's going on?", 'WAIT', 'WHY', 'NOPE', 'HELP'];

    const asciiDancers = [
      ['  O\n /|\\\n / \\'],
      [' ┌( ಠ_ಠ )┘',' └( ಠ_ಠ )┐'],
      ['╰(°∇≦*)╮','╭(°∇≦*)╰'],
      ['(づ｡◕‿‿◕｡)づ'],
      ['(ง •̀_•́)ง'],
      ['(ノಠ益ಠ)ノ']
    ];

    // state
    let activeCharacters = [];
    const MAX_CHAR = isMobile() ? 10 : 20;
    let animationRunning = false;
    let spawnIntervalId = null;
    let rafId = null;

    // set cookie art and end text
    document.getElementById('cookieArt').textContent = cookieASCII;
    document.getElementById('endText').textContent = "Here's a cookie for watching till the end";

    // start button handler (hides reliably and starts animations)
    document.getElementById('startBtn').addEventListener('click', () => {
      const btnContainer = document.getElementById('buttonContainer');
      btnContainer.style.display = 'none';
      btnContainer.style.pointerEvents = 'none';

      const videoContainer = document.getElementById('videoContainer');
      videoContainer.style.display = 'block';
      const video = document.getElementById('prankVideo');

      animationRunning = true;
      startBackground();
      startScreenEffects();
      startVideoZoom(video);

      video.play().catch(e => console.warn('video play prevented:', e));
      video.addEventListener('ended', showEndScreen, { once: true });
    });

    function showEndScreen() {
      animationRunning = false;
      if (spawnIntervalId) clearInterval(spawnIntervalId);
      if (rafId) cancelAnimationFrame(rafId);
      document.getElementById('videoContainer').style.display = 'none';
      document.getElementById('endScreen').style.display = 'block';
      document.getElementById('cookieArt').textContent = cookieASCII;
    }

    // spawn and animate characters (clean, deterministic bob + small drift)
    function startBackground(){
      // spawn initial set
      const initial = Math.min(6, MAX_CHAR);
      for (let i = 0; i < initial; i++) spawnCharacter();
      // spawn rate-limited
      spawnIntervalId = setInterval(() => {
        if (!animationRunning) return;
        if (activeCharacters.length < MAX_CHAR) spawnCharacter();
      }, isMobile() ? 900 : 650);

      // start RAF loop
      rafId = requestAnimationFrame(animationLoop);
    }

    function spawnCharacter(){
      const frames = asciiDancers[Math.floor(Math.random() * asciiDancers.length)];
      const el = document.createElement('div');
      el.className = 'ascii-character';
      el.style.color = '#a8dadc';
      const fontSize = isMobile() ? (10 + Math.random() * 6) : (12 + Math.random() * 8);
      el.style.fontSize = fontSize + 'px';
      el.style.opacity = 0.88;
      el.textContent = frames[0];

      // place fairly evenly but not overlapping center
      const margin = 30;
      const w = window.innerWidth - margin * 2;
      const h = window.innerHeight - margin * 2;
      const x = margin + Math.random() * w;
      const y = margin + Math.random() * h;

      el.style.left = Math.round(x) + 'px';
      el.style.top = Math.round(y) + 'px';
      document.getElementById('backgroundLayer').appendChild(el);

      // slow deterministic bob parameters (independent of video)
      const baseY = y;
      const offset = Math.random() * 1000;
      const freq = 1.1 + Math.random() * 0.6; // bob frequency
      const amp = 3 + Math.random() * 6;      // bob amplitude (px)
      const vx = (Math.random() - 0.5) * 0.3; // tiny horizontal drift
      const vy = (Math.random() - 0.5) * 0.18;

      const character = {
        element: el,
        frames,
        frameIndex: 0,
        frameTimer: 0,
        frameInterval: 320 + Math.random() * 260,
        x, y, baseY, offset, freq, amp, vx, vy,
        lifetime: 24000 // graceful removal if needed
      };

      activeCharacters.push(character);
    }

    function spawnFloatingText(){
      const txt = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = txt;
      const left = 12 + Math.random() * (window.innerWidth - 120);
      const top = 40 + Math.random() * (window.innerHeight - 120);
      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      el.style.color = ['#ff6b6b','#ffd93d','#6bcf7f','#4d96ff'][Math.floor(Math.random() * 4)];
      el.style.fontSize = isMobile() ? (12 + Math.random() * 8) + 'px' : (14 + Math.random() * 12) + 'px';
      document.getElementById('backgroundLayer').appendChild(el);
      el.animate([
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-80px)', opacity: 0 }
      ], { duration: 2800, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => el.remove();
    }

    // main animation loop (single RAF)
    function animationLoop(now){
      // update characters
      for (let i = activeCharacters.length - 1; i >= 0; i--){
        const c = activeCharacters[i];
        // frame advance
        c.frameTimer += 16;
        if (c.frameTimer >= c.frameInterval){
          c.frameIndex = (c.frameIndex + 1) % c.frames.length;
          c.element.textContent = c.frames[c.frameIndex];
          c.frameTimer = 0;
        }
        // deterministic bob & small drift (NO sync to video)
        const t = (now + c.offset) * 0.001;
        c.y = c.baseY + Math.sin(t * c.freq) * c.amp;
        c.x += c.vx;
        // gentle decay on vx so they don't drift off
        c.vx *= 0.997;

        // lifetime guard
        c.lifetime -= 16;
        if (c.lifetime <= 0 || c.x < -120 || c.x > window.innerWidth + 120 || c.y < -120 || c.y > window.innerHeight + 120){
          c.element.remove();
          activeCharacters.splice(i, 1);
          continue;
        }
        c.element.style.left = Math.round(c.x) + 'px';
        c.element.style.top = Math.round(c.y) + 'px';
      }

      // sometimes spawn floating text
      if (animationRunning && Math.random() < 0.01) spawnFloatingText();

      rafId = requestAnimationFrame(animationLoop);
    }

    function startScreenEffects(){
      setInterval(() => {
        if (!animationRunning) return;
        if (Math.random() < 0.08){
          const colors = ['#1a1a1a','#2a1a2a','#1a2a2a','#2a2a1a'];
          const c = colors[Math.floor(Math.random() * colors.length)];
          document.body.style.backgroundColor = c;
          setTimeout(() => document.body.style.backgroundColor = '#1a1a1a', 120);
        }
      }, 900);
    }

    function startVideoZoom(video){
      // gentle zoom while playing (no movement sync)
      function update(){
        if (!video || video.paused || video.ended) return;
        const dur = video.duration;
        if (dur && !isNaN(dur)){
          const p = Math.min(1, video.currentTime / dur);
          const s = 1 + p * 0.04;
          document.getElementById('videoContainer').style.transform = `translate(-50%, -50%) scale(${s})`;
        }
        requestAnimationFrame(update);
      }
      video.addEventListener('playing', () => requestAnimationFrame(update));
    }

    // cleanup on resize: keep behavior stable for mobile/desktop
    window.addEventListener('resize', () => {
      // cap characters if viewport shrinks
      const maxNow = isMobile() ? 10 : 20;
      while (activeCharacters.length > maxNow){
        const c = activeCharacters.pop();
        if (c && c.element) c.element.remove();
      }
    });
  </script>
</body>
</html>
