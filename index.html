<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are you sure?</title>

    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .trust-btn {
            background: #8b5cf6;
            color: white;
            border: 4px solid #ffffff;

            padding: 18px 40px;
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;

            border-radius: 0;
            cursor: pointer;

            box-shadow: 6px 6px 0 #4c1d95;
        }

        .trust-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #4c1d95;
        }

        .trust-btn:active {
            transform: translate(6px, 6px);
            box-shadow: none;
        }

        #prankVideo {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <button class="trust-btn" onclick="startPrank()">TRUST ME</button>

    <video id="prankVideo" loop playsinline src="ez.mp4"></video>

    <script>
        function startPrank() {
            const video = document.getElementById("prankVideo");

            video.style.display = "block";

            video.play().catch(error => {
                console.log("Playback failed:", error);
            });

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }
    </script>

</body>
</html>
