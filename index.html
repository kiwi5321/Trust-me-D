```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are you sure?</title>

    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .bait-container {
            text-align: center;
        }

        .trust-btn {
            background-color: #ff3366;
            color: white;
            border: 4px solid white;
            padding: 18px 45px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #a8002d;
            transition: transform 0.15s;
            transform: rotate(-3deg);
        }

        .trust-btn:hover {
            animation: wiggle 0.4s infinite;
        }

        .trust-btn:active {
            transform: translateY(5px) rotate(0deg);
            box-shadow: 0 1px 0 #a8002d;
        }

        @keyframes wiggle {
            0% {
                transform: scale(1.15) rotate(-5deg);
            }

            50% {
                transform: scale(1.15) rotate(5deg);
            }

            100% {
                transform: scale(1.15) rotate(-5deg);
            }
        }

        #prankVideo {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
        }
    </style>
</head>

<body>

    <div class="bait-container" id="baitBox">
        <button class="trust-btn" onclick="startPrank()">
            TRUST ME
        </button>
    </div>

    <video id="prankVideo" loop playsinline src="ez.mp4"></video>

    <script>
        function startPrank() {
            const video = document.getElementById('prankVideo');
            const baitBox = document.getElementById('baitBox');

            baitBox.style.display = 'none';
            video.style.display = 'block';

            video.play().catch(error => {
                console.log("Playback failed:", error);
            });

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }
    </script>

</body>
</html>
```
