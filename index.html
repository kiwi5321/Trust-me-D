<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are you sure?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            transition: background-color 0.1s;
        }

        body.color-shift {
            background-color: #2a1a2a;
        }

        #backgroundLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .ascii-character {
            position: absolute;
            font-family: 'Courier New', monospace;
            white-space: pre;
            user-select: none;
            line-height: 1.1;
        }

        .floating-text {
            position: absolute;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            user-select: none;
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
            opacity: 0.7;
            z-index: 2;
        }

        #buttonContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .trust-btn {
            background: #8b5cf6;
            color: white;
            border: 4px solid white;
            padding: 18px 40px;
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: bold;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 6px 6px 0 #4c1d95;
            transition: all 0.1s ease;
        }

        .trust-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #4c1d95;
        }

        .trust-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #4c1d95;
        }

        #videoContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 50;
            display: none;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.6));
        }

        #prankVideo {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
            border: 3px solid #8b5cf6;
            border-radius: 4px;
        }

        #colorFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="backgroundLayer"></div>
    <div id="colorFlash"></div>

    <div id="buttonContainer">
        <button class="trust-btn" onclick="startPrank()">TRUST ME</button>
    </div>

    <div id="videoContainer">
        <video id="prankVideo" loop playsinline>
            <source src="./HEYYEYAAEYAAAEYAEYAA%20(HQ)(3).mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const floatingPhrases = [
            'HEYYEYAAEYAAAEYAEYAA',
            "What's going on?",
            '┌( ಠ_ಠ )┘',
            '╰(°∇≦*)╮',
            'WAIT',
            'WHY',
            'NOPE',
            'HELP',
            '???',
            'LMAO',
            'RUN'
        ];

        const extraEmojis = [
            '⊙_⊙',
            'ಠ╭╮ಠ',
            '(ノಠ益ಠ)ノ',
            '(╯°□°)╯︵ ┻━┻',
            '┬─┬ ノ( ゜-゜ノ)',
            'ヽ༼ຈل͜ຈ༽ノ',
            '(´・ω・`)',
            '(´；ω；`)',
            'щ(゜ロ゜щ)',
            '(๑•́ ω •̀๑)',
            'ლ(´ڡ`ლ)',
            '(°ロ°)σ'
        ];

        const asciiDancers = [
            {
                name: 'dancer1',
                frames: [
                    '  O\n /|\\\n / \\',
                    '  O\n /|\\\n/ \\',
                    '  O\n /|\\\n \\ /',
                    '  O\n ||\\\n/ \\'
                ],
                color: '#a8dadc'
            },
            {
                name: 'dancer2',
                frames: [
                    ' ┌( ಠ_ಠ )┘',
                    ' └( ಠ_ಠ )┐',
                    ' ┌( ಠ_ಠ )┘',
                    ' └( ಠ_ಠ )┐'
                ],
                color: '#b8e0d2'
            },
            {
                name: 'dancer3',
                frames: [
                    '╰(°∇≦*)╮',
                    '╭(°∇≦*)╰',
                    '╰(°∇≦*)╮',
                    '╭(°∇≦*)╰'
                ],
                color: '#d4c5f9'
            },
            {
                name: 'dancer4',
                frames: [
                    '└(°д°)┐',
                    '┌(°д°)┘',
                    '└(°д°)┐',
                    '┌(°д°)┘'
                ],
                color: '#95b8d1'
            },
            {
                name: 'dancer5',
                frames: [
                    'ヽ(°◇° )ノ',
                    'ヽ( °◇°)ノ',
                    'ヽ(°◇° )ノ',
                    'ヽ( °◇°)ノ'
                ],
                color: '#b5ead7'
            },
            {
                name: 'dancer6',
                frames: [
                    ' O/\n/|\n/ \\',
                    'O\n||\n/ \\',
                    '\\O\n||\\n\\ /',
                    ' O\n/|\\\n\\ /'
                ],
                color: '#ffdac1'
            },
            {
                name: 'dancer7',
                frames: [
                    '(ง •̀_•́)ง',
                    '(ง •́_•̀)ง',
                    '(ง •̀_•́)ง',
                    '(ง •́_•̀)ง'
                ],
                color: '#e0aaff'
            },
            {
                name: 'dancer8',
                frames: [
                    '(ノಠ益ಠ)ノ',
                    'ヽ(ಠ益ಠ)ノ',
                    '(ノಠ益ಠ)ノ',
                    'ヽ(ಠ益ಠ)ノ'
                ],
                color: '#c7ceea'
            },
            {
                name: 'dancer9',
                frames: [
                    '¯\\_(ツ)_/¯',
                    '_¯(ツ)¯_',
                    '¯\\_(ツ)_/¯',
                    '_¯(ツ)¯_'
                ],
                color: '#ffc8dd'
            },
            {
                name: 'dancer10',
                frames: [
                    '(づ｡◕‿‿◕｡)づ',
                    '(づ｡◕‿◕｡)づ',
                    '(づ｡◕‿‿◕｡)づ',
                    '(づ｡◕‿◕｡)づ'
                ],
                color: '#caffbf'
            },
            {
                name: 'dancer11',
                frames: [
                    ' \\ O /\n  ||\n / \\',
                    ' / O \\\n  ||\n \\ /',
                    ' \\ O /\n  ||\n / \\'
                ],
                color: '#9bf6ff'
            },
            {
                name: 'dancer12',
                frames: [
                    '┌(・o・)┐',
                    '└(・o・)┘',
                    '┌(・o・)┐',
                    '└(・o・)┘'
                ],
                color: '#bdb2ff'
            }
        ];

        let activeCharacters = [];
        const maxCharacters = 25;
        let animationRunning = false;
        let shakeIntensity = 0;

        function startPrank() {
            document.getElementById('buttonContainer').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            const video = document.getElementById('prankVideo');
            video.play().catch(error => {
                console.error('Playback failed:', error);
            });
            animationRunning = true;
            startBackgroundAnimation();
            startVideoZoom(video);
            startScreenEffects();
        }

        function startScreenEffects() {
            // Screen shake
            setInterval(() => {
                if (animationRunning && Math.random() < 0.3) {
                    shakeIntensity = 2 + Math.random() * 3;
                    const shakeX = (Math.random() - 0.5) * shakeIntensity;
                    const shakeY = (Math.random() - 0.5) * shakeIntensity;
                    document.body.style.transform = `translate(${shakeX}px, ${shakeY}px)`;
                    
                    setTimeout(() => {
                        document.body.style.transform = 'translate(0, 0)';
                    }, 50);
                }
            }, 300);

            // Color shifts
            const colorShifts = ['#1a1a1a', '#2a1a2a', '#1a2a2a', '#2a2a1a', '#2a1a1a'];
            setInterval(() => {
                if (animationRunning && Math.random() < 0.2) {
                    const randomColor = colorShifts[Math.floor(Math.random() * colorShifts.length)];
                    document.body.style.backgroundColor = randomColor;
                    setTimeout(() => {
                        document.body.style.backgroundColor = '#1a1a1a';
                    }, 200);
                }
            }, 800);

            // Color flashes
            setInterval(() => {
                if (animationRunning && Math.random() < 0.15) {
                    const flashColors = ['rgba(255,0,0,0.1)', 'rgba(0,255,0,0.1)', 'rgba(0,0,255,0.1)', 'rgba(255,255,0,0.1)'];
                    const flash = document.getElementById('colorFlash');
                    flash.style.backgroundColor = flashColors[Math.floor(Math.random() * flashColors.length)];
                    flash.style.display = 'block';
                    setTimeout(() => {
                        flash.style.display = 'none';
                    }, 100);
                }
            }, 1000);

            // Random floating text
            setInterval(() => {
                if (animationRunning && Math.random() < 0.4) {
                    spawnFloatingText();
                }
            }, 1500);
        }

        function spawnFloatingText() {
            const text = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
            const element = document.createElement('div');
            element.className = 'floating-text';
            element.textContent = text;
            element.style.left = Math.random() * window.innerWidth + 'px';
            element.style.top = Math.random() * window.innerHeight + 'px';
            element.style.color = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff'][Math.floor(Math.random() * 4)];
            element.style.fontSize = (20 + Math.random() * 20) + 'px';
            element.style.transform = `rotate(${Math.random() * 360}deg)`;

            document.getElementById('backgroundLayer').appendChild(element);

            setTimeout(() => {
                element.remove();
            }, 3000);
        }

        function startVideoZoom(video) {
            const startWidth = 640;
            const endWidth = window.innerWidth * 1.2;
            const startHeight = 360;
            const endHeight = window.innerHeight * 1.2;

            const updateZoom = () => {
                const currentTime = video.currentTime;
                const duration = video.duration;
                
                if (duration && !isNaN(duration)) {
                    const progress = Math.min(currentTime / duration, 1);
                    
                    const currentWidth = startWidth + (endWidth - startWidth) * progress;
                    const currentHeight = startHeight + (endHeight - startHeight) * progress;
                    
                    // Zoom blur effect
                    const blur = progress * 3;
                    
                    const videoContainer = document.getElementById('videoContainer');
                    videoContainer.style.filter = `drop-shadow(0 0 ${20 + blur * 5}px rgba(139, 92, 246, 0.6)) blur(${blur * 0.1}px)`;
                    videoContainer.style.transform = `translate(-50%, -50%) scale(${1 + progress * 0.1})`;
                    
                    video.style.width = currentWidth + 'px';
                    video.style.height = currentHeight + 'px';
                }
                
                if (video.played && video.currentTime > 0 && video.currentTime < video.duration) {
                    requestAnimationFrame(updateZoom);
                }
            };

            video.addEventListener('playing', () => {
                updateZoom();
            });

            video.addEventListener('timeupdate', () => {
                updateZoom();
            });
        }

        function startBackgroundAnimation() {
            spawnCharacter();
            setInterval(() => {
                if (activeCharacters.length < maxCharacters && animationRunning) {
                    spawnCharacter();
                }
            }, 600);

            let lastPhraseTime = 0;
            setInterval(() => {
                if (Math.random() < 0.3 && activeCharacters.length < maxCharacters && animationRunning) {
                    const now = Date.now();
                    if (now - lastPhraseTime > 3000) {
                        spawnPhrase();
                        lastPhraseTime = now;
                    }
                }
            }, 1000);

            // Spawn extra emoji characters
            setInterval(() => {
                if (Math.random() < 0.4 && animationRunning) {
                    spawnEmojiCharacter();
                }
            }, 2000);

            updateAnimation();
        }

        function spawnEmojiCharacter() {
            const emoji = extraEmojis[Math.floor(Math.random() * extraEmojis.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.textContent = emoji;
            element.style.color = '#' + Math.floor(Math.random()*16777215).toString(16);
            element.style.fontSize = (16 + Math.random() * 12) + 'px';
            element.style.opacity = 0.6 + Math.random() * 0.4;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = 0.5 + Math.random() * 2;

            const character = {
                element: element,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                isEmoji: true,
                lifetime: 8000
            };

            activeCharacters.push(character);
        }

        function spawnCharacter() {
            const dancer = asciiDancers[Math.floor(Math.random() * asciiDancers.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.style.color = dancer.color;
            element.style.fontSize = (12 + Math.random() * 8) + 'px';
            element.style.opacity = 0.5 + Math.random() * 0.5;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = 0.5 + Math.random() * 1.5;
            
            let movementType = Math.floor(Math.random() * 7);
            let extraData = {};

            if (movementType === 6) {
                extraData.centerX = window.innerWidth * 0.5;
                extraData.centerY = window.innerHeight * 0.5;
                extraData.radius = 50 + Math.random() * 100;
                extraData.angle = Math.random() * Math.PI * 2;
            }

            const character = {
                element: element,
                dancer: dancer,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                frameIndex: 0,
                frameTimer: 0,
                frameInterval: 200 + Math.random() * 300,
                movementType: movementType,
                speed: speed,
                extraData: extraData
            };

            activeCharacters.push(character);
        }

        function spawnPhrase() {
            const phrase = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.style.color = '#a8dadc';
            element.style.fontSize = (14 + Math.random() * 6) + 'px';
            element.style.opacity = 0.4 + Math.random() * 0.3;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';
            element.textContent = phrase;

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = 0.3 + Math.random() * 0.8;

            const character = {
                element: element,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                isPhrase: true,
                lifetime: 15000
            };

            activeCharacters.push(character);
        }

        function updateAnimation() {
            const padding = 150;
            const toRemove = [];

            for (let i = 0; i < activeCharacters.length; i++) {
                const char = activeCharacters[i];

                if (char.isPhrase || char.isEmoji) {
                    char.lifetime -= 16;
                    if (char.lifetime <= 0) {
                        char.element.remove();
                        toRemove.push(i);
                        continue;
                    }
                    char.x += char.vx;
                    char.y += char.vy;
                } else {
                    char.frameTimer += 16;
                    if (char.frameTimer >= char.frameInterval) {
                        char.frameIndex = (char.frameIndex + 1) % char.dancer.frames.length;
                        char.element.textContent = char.dancer.frames[char.frameIndex];
                        char.frameTimer = 0;
                    }

                    if (char.movementType === 0) {
                        char.x += char.vx;
                        char.y += char.vy;
                    } else if (char.movementType === 1) {
                        char.y += char.speed;
                        if (Math.random() < 0.02) {
                            char.vx = (Math.random() - 0.5) * 2;
                        }
                        char.x += char.vx * 0.5;
                    } else if (char.movementType === 2) {
                        char.x += char.speed;
                        if (Math.random() < 0.03) {
                            char.vy = (Math.random() - 0.5) * 1.5;
                        }
                        char.y += char.vy;
                    } else if (char.movementType === 3) {
                        char.x += Math.sin(Date.now() * 0.002) * 2;
                        char.y += char.speed * 0.5;
                    } else if (char.movementType === 4) {
                        if (Math.random() < 0.05) {
                            char.vx = (Math.random() - 0.5) * 3;
                            char.vy = (Math.random() - 0.5) * 3;
                        }
                        char.x += char.vx;
                        char.y += char.vy;
                    } else if (char.movementType === 5) {
                        char.x += char.vx;
                        char.y += char.vy;
                        if (char.vy < 2) char.vy += 0.1;
                        if (char.y > window.innerHeight) {
                            char.vy = -Math.random() * 3;
                            char.y = window.innerHeight;
                        }
                    } else if (char.movementType === 6) {
                        char.extraData.angle += 0.05;
                        char.x = char.extraData.centerX + Math.cos(char.extraData.angle) * char.extraData.radius;
                        char.y = char.extraData.centerY + Math.sin(char.extraData.angle) * char.extraData.radius;
                    }

                    if (char.x < -padding || char.x > window.innerWidth + padding ||
                        char.y < -padding || char.y > window.innerHeight + padding) {
                        char.element.remove();
                        toRemove.push(i);
                        continue;
                    }
                }

                char.element.style.left = char.x + 'px';
                char.element.style.top = char.y + 'px';
            }

            for (let i = toRemove.length - 1; i >= 0; i--) {
                activeCharacters.splice(toRemove[i], 1);
            }

            if (animationRunning) {
                requestAnimationFrame(updateAnimation);
            }
        }
    </script>

</body>
</html>
