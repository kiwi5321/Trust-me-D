<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Are you sure?</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      width:100%;height:100vh;background:#1a1a1a;display:flex;
      justify-content:center;align-items:center;overflow:hidden;
      font-family:'Courier New',monospace;transition:background-color .1s;
    }
    #backgroundLayer{
      position:fixed;inset:0;z-index:1;pointer-events:none;
      overflow:hidden;
    }
    .ascii-character{
      position:absolute;
      font-family:'Courier New',monospace;
      white-space:pre;
      user-select:none;
      line-height:1.05;
      will-change:left,top;
      transform-origin:center;
    }
    .floating-text{
      position:absolute;white-space:nowrap;font-family:'Courier New',monospace;
      user-select:none;opacity:.9;z-index:2;pointer-events:none;
      transform-origin:center;
    }
    #buttonContainer{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:100;padding:20px;
    }
    .trust-btn{
      background:#8b5cf6;color:#fff;border:4px solid #fff;
      padding:12px 28px;font-family:'Courier New',monospace;font-weight:700;
      font-size:18px;cursor:pointer;box-shadow:6px 6px 0 #4c1d95;
      transition:all .08s ease;
    }
    .trust-btn:active{transform:translate(6px,6px);box-shadow:0 0 0 #4c1d95}
    #videoContainer{
      position:fixed;top:50%;left:50%;z-index:50;display:none;
      transform:translate(-50%,-50%);filter:drop-shadow(0 0 20px rgba(139,92,246,.6));
      padding:10px;max-width:95vw;max-height:95vh;
    }
    #prankVideo{width:100%;height:auto;border:3px solid #8b5cf6;border-radius:4px}
    #endScreen{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:100;display:none;text-align:center;background:rgba(26,26,26,.95);
      padding:30px;border:3px solid #8b5cf6;border-radius:6px;max-width:90vw;overflow:auto;
    }
    #endScreen h1{color:#ffd93d;margin-bottom:12px}
    #cookieArt{font-family:'Courier New',monospace;color:#d4a574;white-space:pre;margin:12px 0}
    #colorBeat{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;transition:background-color .08s}
    @media(max-width:768px){
      .trust-btn{font-size:16px;padding:10px 18px}
      .floating-text{font-size:14px}
      .ascii-character{font-size:12px}
    }
  </style>
</head>
<body>
  <div id="backgroundLayer"></div>
  <div id="colorBeat"></div>

  <div id="buttonContainer">
    <button class="trust-btn" id="startBtn">TRUST ME</button>
  </div>

  <div id="videoContainer">
    <video id="prankVideo" loop playsinline>
      <source src="./HEYYEYAAEYAAAEYAEYAA%20(HQ)(3).mp4" type="video/mp4">
    </video>
  </div>

  <div id="endScreen">
    <h1>You watched till the end!</h1>
    <div id="cookieArt"></div>
    <p id="endText">Here's a cookie for watching till the end</p>
  </div>

  <script>
    // cookie ASCII art
    const cookieASCII = `
         .-""""-.
       .'  .--.  '.
      /  .'.--.'.  \\
     |  / /    \\ \\  |
     ; |  |    |  | ;
     | |  |    |  | |
     ; |  '.__.'  | ;
      \\ \\        / /
       '.'.____.'.'
         '-.____.-'
    `;

    const isMobile = () => window.innerWidth <= 768;
    const floatingPhrases = ['HEYYEYAAEYAAAEYAEYAA',"What's going on?","WAIT","WHY","NOPE","HELP","LMAO"];
    const asciiDancers = [
      ['  O\n /|\\\n / \\'],
      [' ┌( ಠ_ಠ )┘',' └( ಠ_ಠ )┐'],
      ['╰(°∇≦*)╮','╭(°∇≦*)╰'],
      ['(づ｡◕‿‿◕｡)づ'],
      ['(ง •̀_•́)ง'],
      ['(ノಠ益ಠ)ノ']
    ];
    let activeCharacters = [];
    const maxCharacters = isMobile() ? 10 : 20;
    let animationRunning = false;
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let beatIntensity = 0;
    let spawnTimer = null;
    let updateRAF = null;

    // Simple peak detection state
    let runningAvg = 0;
    let lastPeak = 0;

    // Setup end screen cookie
    document.getElementById('cookieArt').textContent = cookieASCII;

    function showEndScreen(){
      animationRunning = false;
      clearInterval(spawnTimer);
      cancelAnimationFrame(updateRAF);
      document.getElementById('videoContainer').style.display = 'none';
      document.getElementById('endScreen').style.display = 'block';
      document.getElementById('cookieArt').textContent = cookieASCII;
      document.getElementById('endText').textContent = "Here's a cookie for watching till the end";
    }

    function startPrank(){
      // hide button reliably
      const bc = document.getElementById('buttonContainer');
      bc.style.display = 'none';
      bc.style.pointerEvents = 'none';

      const vidCont = document.getElementById('videoContainer');
      vidCont.style.display = 'block';
      const video = document.getElementById('prankVideo');

      animationRunning = true;
      startSimpleBackground();
      startScreenEffects();
      startVideoZoom(video);
      initAudioContext(video);

      video.play().catch(e => console.warn('video play prevented', e));
      video.addEventListener('ended', showEndScreen, { once: true });
    }

    async function initAudioContext(video){
      try{
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 512;
        const src = audioContext.createMediaElementAudioSource(video);
        src.connect(analyser);
        analyser.connect(audioContext.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        // resume (some browsers require user gesture)
        if (audioContext.state === 'suspended') await audioContext.resume();
        startBeatDetection();
      }catch(e){
        console.log('Audio not available, using fallback timing', e);
        startBeatFallback();
      }
    }

    function startBeatDetection(){
      function detect(){
        if (!animationRunning) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i=0;i<dataArray.length;i++) sum += dataArray[i];
        const instant = sum / dataArray.length / 255; // 0..1
        runningAvg = 0.92 * runningAvg + 0.08 * instant;
        const diff = Math.max(0, instant - runningAvg);
        beatIntensity = Math.min(1, instant * 1.3);
        const t = performance.now();
        // small peak detection to make the dance punchier
        if (diff > 0.06 && t - lastPeak > 120){ lastPeak = t; triggerBeatPulse(); }
        requestAnimationFrame(detect);
      }
      detect();
    }

    function startBeatFallback(){
      setInterval(()=>{ if (!animationRunning) return; beatIntensity = Math.random()*0.7; triggerBeatPulse(); }, 300);
    }

    function triggerBeatPulse(){
      // momentary highlight
      const beatEl = document.getElementById('colorBeat');
      beatEl.style.backgroundColor = `rgba(200,120,255,${0.15 + beatIntensity*0.25})`;
      beatEl.style.display = 'block';
      setTimeout(()=>{ beatEl.style.display = 'none'; }, 120);
    }

    // spawn management: limited, ordered, stable bobbing
    function startSimpleBackground(){
      // spawn a few immediately
      for (let i=0;i<Math.min(6, maxCharacters); i++) spawnCharacter();
      // spawn timer (rate-limited)
      spawnTimer = setInterval(()=>{
        if (!animationRunning) return;
        if (activeCharacters.length < maxCharacters) spawnCharacter();
      }, isMobile() ? 900 : 600);
      updateAnimation();
    }

    function spawnCharacter(){
      const dancerFrames = asciiDancers[Math.floor(Math.random()*asciiDancers.length)];
      const el = document.createElement('div');
      el.className = 'ascii-character';
      el.style.color = '#a8dadc';
      const fs = isMobile() ? (10 + Math.random()*6) : (12 + Math.random()*8);
      el.style.fontSize = fs + 'px';
      el.style.opacity = 0.85;
      el.textContent = dancerFrames[0];

      // place around center but not overlapping video too aggressively
      const w = window.innerWidth, h = window.innerHeight;
      const margin = 40;
      const x = margin + Math.random() * (w - margin*2);
      const y = margin + Math.random() * (h - margin*2);
      el.style.left = Math.round(x) + 'px';
      el.style.top = Math.round(y) + 'px';
      document.getElementById('backgroundLayer').appendChild(el);

      // small drift velocities, constrained
      const vx = (Math.random() - 0.5) * 0.4; // slow drift
      const vy = (Math.random() - 0.5) * 0.25;

      const char = {
        element: el,
        frames: dancerFrames,
        frameIndex: 0,
        frameTimer: 0,
        frameInterval: 280 + Math.random()*220,
        x, y, baseY: y,
        vx, vy,
        offset: Math.random()*1000,
        lifetime: 20000 // graceful removal if necessary
      };
      activeCharacters.push(char);
    }

    function spawnFloatingText(){
      const txt = floatingPhrases[Math.floor(Math.random()*floatingPhrases.length)];
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = txt;
      const left = 12 + Math.random()*(window.innerWidth - 120);
      const top = 50 + Math.random()*(window.innerHeight - 120);
      el.style.left = left + 'px';
      el.style.top = top + 'px';
      el.style.color = ['#ff6b6b','#ffd93d','#6bcf7f','#4d96ff'][Math.floor(Math.random()*4)];
      el.style.fontSize = isMobile() ? (12 + Math.random()*8)+'px' : (14 + Math.random()*12)+'px';
      document.getElementById('backgroundLayer').appendChild(el);
      el.animate([{opacity:1, transform:'translateY(0)'}, {opacity:0, transform:'translateY(-70px)'}], {duration:2800, easing:'ease-out'}).onfinish = ()=>el.remove();
    }

    function updateAnimation(){
      const now = performance.now();
      // update dancers
      for (let i = activeCharacters.length - 1; i >= 0; i--){
        const c = activeCharacters[i];
        // frame update faster when beatIntensity larger
        c.frameTimer += 16;
        const effInterval = Math.max(70, c.frameInterval * (1 - beatIntensity*0.55));
        if (c.frameTimer >= effInterval){
          c.frameIndex = (c.frameIndex + 1) % c.frames.length;
          c.element.textContent = c.frames[c.frameIndex];
          c.frameTimer = 0;
        }

        // vertical bob synced to beatIntensity (always gentle)
        const t = (now + c.offset) * 0.002;
        const freq = 1.2 + beatIntensity*3.0;
        const amp = 4 + beatIntensity*12;
        c.y = c.baseY + Math.sin(t * freq) * amp;

        // gentle horizontal drift (very small)
        c.x += c.vx;
        // apply tiny damping so they don't run away
        c.vx *= 0.995;
        c.vy *= 0.995;
        // small vertical nudges from vy as slow drift
        c.y += c.vy * 0.5;

        // keep onscreen
        const padding = 40;
        if (c.x < -padding || c.x > window.innerWidth + padding || c.y < -padding || c.y > window.innerHeight + padding){
          // remove out-of-bounds characters
          c.element.remove();
          activeCharacters.splice(i,1);
          continue;
        }

        // lifetime guard (remove gently near end)
        c.lifetime -= 16;
        if (c.lifetime <= 0){
          c.element.remove();
          activeCharacters.splice(i,1);
          continue;
        }

        c.element.style.left = Math.round(c.x) + 'px';
        c.element.style.top = Math.round(c.y) + 'px';
      }

      // occasionally spawn floating text (readable, not rotated)
      if (animationRunning && Math.random() < 0.01) spawnFloatingText();

      updateRAF = requestAnimationFrame(updateAnimation);
    }

    function startScreenEffects(){
      // small background color pulses occasionally
      setInterval(()=>{
        if (!animationRunning) return;
        if (Math.random() < 0.08){
          const cols = ['#1a1a1a','#2a1a2a','#1a2a2a','#2a2a1a'];
          const c = cols[Math.floor(Math.random()*cols.length)];
          document.body.style.backgroundColor = c;
          setTimeout(()=>document.body.style.backgroundColor = '#1a1a1a',120);
        }
      }, 800);
    }

    function startVideoZoom(video){
      const updateZoom = ()=>{
        if (!video || video.paused || video.ended) return;
        const dur = video.duration;
        if (dur && !isNaN(dur)){
          const progress = Math.min(1, video.currentTime / dur);
          const scale = 1 + progress*0.05;
          document.getElementById('videoContainer').style.transform = `translate(-50%,-50%) scale(${scale})`;
        }
        requestAnimationFrame(updateZoom);
      };
      video.addEventListener('playing', ()=>requestAnimationFrame(updateZoom));
    }

    // single start handler
    document.getElementById('startBtn').addEventListener('click', startPrank);

    // fallback beat if audio not available
    setInterval(()=>{
      if (!animationRunning) return;
      // slowly relax beatIntensity back towards 0 (if audio provides none)
      beatIntensity = Math.max(0, beatIntensity * 0.95);
    }, 200);
  </script>
</body>
</html>
