<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are you sure?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            transition: background-color 0.1s;
        }

        body.color-shift {
            background-color: #2a1a2a;
        }

        #backgroundLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .ascii-character {
            position: absolute;
            font-family: 'Courier New', monospace;
            white-space: pre;
            user-select: none;
            line-height: 1.1;
        }

        .floating-text {
            position: absolute;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            user-select: none;
            opacity: 0.7;
            z-index: 2;
        }

        #buttonContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            padding: 20px;
        }

        .trust-btn {
            background: #8b5cf6;
            color: white;
            border: 4px solid white;
            padding: clamp(12px, 4vw, 18px) clamp(24px, 8vw, 40px);
            font-family: 'Courier New', monospace;
            font-size: clamp(18px, 5vw, 28px);
            font-weight: bold;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 6px 6px 0 #4c1d95;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .trust-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #4c1d95;
        }

        .trust-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #4c1d95;
        }

        #videoContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 50;
            display: none;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.6));
            padding: 10px;
            max-width: 95vw;
            max-height: 95vh;
        }

        #prankVideo {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            display: block;
            border: 3px solid #8b5cf6;
            border-radius: 4px;
            max-width: 100%;
            max-height: 100%;
        }

        #endScreen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            text-align: center;
            background: rgba(26, 26, 26, 0.95);
            padding: 40px;
            border: 3px solid #8b5cf6;
            border-radius: 4px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        #endScreen h1 {
            font-size: clamp(24px, 8vw, 48px);
            color: #ffd93d;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 217, 61, 0.5);
        }

        #cookieArt {
            font-family: 'Courier New', monospace;
            color: #d4a574;
            font-size: clamp(12px, 3vw, 20px);
            white-space: pre;
            margin: 30px 0;
            line-height: 1.2;
            text-shadow: 0 0 10px rgba(212, 165, 116, 0.3);
        }

        #endScreen p {
            font-size: clamp(16px, 4vw, 24px);
            color: #a8dadc;
            margin-top: 30px;
        }

        #colorBeat {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
            background-color: transparent;
            transition: background-color 0.1s ease;
        }

        /* Mobile-specific optimizations */
        @media (max-width: 768px) {
            .floating-text {
                font-size: clamp(14px, 4vw, 18px);
            }

            .ascii-character {
                font-size: clamp(10px, 3vw, 14px) !important;
            }

            #endScreen {
                padding: 20px;
            }

            body {
                overflow-y: auto;
            }
        }

        @media (max-width: 480px) {
            #buttonContainer {
                padding: 10px;
            }

            .trust-btn {
                min-width: 200px;
            }

            .floating-text {
                font-size: clamp(12px, 3vw, 16px);
            }

            #endScreen {
                padding: 15px;
                border: 2px solid #8b5cf6;
            }
        }
    </style>
</head>
<body>

    <div id="backgroundLayer"></div>
    <div id="colorBeat"></div>

    <div id="buttonContainer">
        <button class="trust-btn" onclick="startPrank()">TRUST ME</button>
    </div>

    <div id="videoContainer">
        <video id="prankVideo" loop playsinline>
            <source src="./HEYYEYAAEYAAAEYAEYAA%20(HQ)(3).mp4" type="video/mp4">
        </video>
    </div>

    <div id="endScreen">
        <h1>You watched till the end!</h1>
        <div id="cookieArt"></div>
        <p>Have a cookie 🍪</p>
    </div>

    <script>
        // Big ASCII Cookie Art
        const cookieASCII = `
    ooOOOOOOOOOOOoo
   oO             Oo
  oO      ███      Oo
 oO      ███████      Oo
oO      █████████      Oo
o      ███████████      o
o     ███ ● ███ ●      o
o      ███████████      o
oO      █████████      Oo
 oO      ███████      Oo
  oO      ███      Oo
   oO             Oo
    ooOOOOOOOOOOOoo
        `;

        // Detect if mobile
        const isMobile = () => window.innerWidth <= 768;

        const floatingPhrases = [
            'HEYYEYAAEYAAAEYAEYAA',
            "What's going on?",
            '┌( ಠ_ಠ )┘',
            '╰(°∇≦*)╮',
            'WAIT',
            'WHY',
            'NOPE',
            'HELP',
            '???',

        ];

        const extraEmojis = [
            '⊙_⊙',
            'ಠ╭╮ಠ',
            '(ノಠ益ಠ)ノ',
            '(╯°□°)╯︵ ┻━┻',
            '┬─┬ ノ( ゜-゜ノ)',
            'ヽ༼ຈل͜ຈ༽ノ',
            '(´・ω・`)',
            '(´；ω；`)',
            'щ(゜ロ゜щ)',
            '(๑•́ ω •̀๑)',

        ];

        const asciiDancers = [
            {
                name: 'dancer1',
                frames: [
                    '  O\n /|\\\n / \\',

            },
            {

                frames: [
                    ' ┌( ಠ_ಠ )┘',
                    ' └( ಠ_ಠ )┐',
                    ' ┌( ಠ_ಠ )┘',
                    ' └( ಠ_ಠ )┐'
                ],
                color: '#b8e0d2'
            },
            {
                name: 'dancer3',
                frames: [
                    '╰(°∇≦*)╮',
                    '╭(°∇≦*)╰',
                    '╰(°∇≦*)╮',
                    '╭(°∇≦*)╰'
                ],
                color: '#d4c5f9'
            },
            {
                name: 'dancer4',
                frames: [
                    '└(°д°)┐',
                    '┌(°д°)┘',
                    '└(°д°)┐',
                    '┌(°д°)┘'
                ],
                color: '#95b8d1'
            },
            {
                name: 'dancer5',
                frames: [
                    'ヽ(°◇° )ノ',
                    'ヽ( °◇°)ノ',
                    'ヽ(°◇° )ノ',
                    'ヽ( °◇°)ノ'
                ],
                color: '#b5ead7'
            },
            {
                name: 'dancer6',
                frames: [
                    ' O/\n/|\n/ \\',
                    'O\n||\n/ \\',
                    '\\O\n||\\n\\ /',
                    ' O\n/|\\\n\\ /'
                ],
                color: '#ffdac1'
            },
            {
                name: 'dancer7',
                frames: [
                    '(ง •̀_•́)ง',
                    '(ง •́_•̀)ง',
                    '(ง •̀_•́)ง',
                    '(ง •́_•̀)ง'
                ],
                color: '#e0aaff'
            },
            {
                name: 'dancer8',
                frames: [
                    '(ノಠ益ಠ)ノ',
                    'ヽ(ಠ益ಠ)ノ',
                    '(ノಠ益ಠ)ノ',
                    'ヽ(ಠ益ಠ)ノ'
                ],
                color: '#c7ceea'
            },
            {
                name: 'dancer9',
                frames: [
                    '¯\\_(ツ)_/¯',
                    '_¯(ツ)¯_',
                    '¯\\_(ツ)_/¯',
                    '_¯(ツ)¯_'
                ],
                color: '#ffc8dd'
            },
            {
                name: 'dancer10',
                frames: [
                    '(づ｡◕‿‿◕｡)づ',
                    '(づ｡◕‿◕｡)づ',
                    '(づ｡◕‿‿◕｡)づ',
                    '(づ｡◕‿◕｡)づ'
                ],
                color: '#caffbf'
            },
            {
                name: 'dancer11',
                frames: [
                    ' \\ O /\n  ||\n / \\',
                    ' / O \\\n  ||\n \\ /',
                    ' \\ O /\n  ||\n / \\'
                ],
                color: '#9bf6ff'
            },
            {
                name: 'dancer12',
                frames: [
                    '┌(・o・)┐',
                    '└(・o・)┘',
                    '┌(・o・)┐',
                    '└(・o・)┘'
                ],
                color: '#bdb2ff'
            }
        ];

        let activeCharacters = [];
        const maxCharacters = isMobile() ? 12 : 25;
        let animationRunning = false;
        let shakeIntensity = 0;
        let audioContext;
        let analyser;
        let dataArray;

        function showEndScreen() {
            animationRunning = false;
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            document.getElementById('cookieArt').textContent = cookieASCII;
            
            // Continue background animation
            animationRunning = true;
            startBackgroundAnimation();
        }

        function startPrank() {
            document.getElementById('buttonContainer').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            const video = document.getElementById('prankVideo');
            video.play().catch(error => {
                console.error('Playback failed:', error);
            });
            animationRunning = true;
            startBackgroundAnimation();
            startVideoZoom(video);
            startScreenEffects();
            initAudioContext(video);

            // Listen for video end
            video.addEventListener('ended', showEndScreen, { once: true });
        }

        function initAudioContext(video) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                
                const source = audioContext.createMediaElementAudioSource(video);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                startBeatDetection();
            } catch (e) {
                console.log('Audio context not supported, using fallback timing');
                startBeatDetectionFallback();
            }
        }

        function startBeatDetection() {
            const beatColors = [
                'rgba(255, 100, 100, 0.2)',
                'rgba(100, 255, 100, 0.2)',
                'rgba(100, 100, 255, 0.2)',
                'rgba(255, 255, 100, 0.2)',
                'rgba(255, 100, 255, 0.2)',
                'rgba(100, 255, 255, 0.2)'
            ];

            const detectBeat = () => {
                if (!animationRunning) return;

                analyser.getByteFrequencyData(dataArray);
                
                let average = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    average += dataArray[i];
                }
                average /= dataArray.length;

                const beatIntensity = average / 255;
                const colorIndex = Math.floor(beatIntensity * (beatColors.length - 1));
                
                const beatElement = document.getElementById('colorBeat');
                beatElement.style.backgroundColor = beatColors[colorIndex];
                
                if (beatIntensity > 0.3) {
                    beatElement.style.display = 'block';
                } else {
                    beatElement.style.display = 'none';
                }

                requestAnimationFrame(detectBeat);
            };

            detectBeat();
        }

        function startBeatDetectionFallback() {
            const beatColors = [
                'rgba(255, 100, 100, 0.2)',
                'rgba(100, 255, 100, 0.2)',
                'rgba(100, 100, 255, 0.2)',
                'rgba(255, 255, 100, 0.2)',
                'rgba(255, 100, 255, 0.2)',
                'rgba(100, 255, 255, 0.2)'
            ];

            setInterval(() => {
                if (animationRunning) {
                    const colorIndex = Math.floor(Math.random() * beatColors.length);
                    const beatElement = document.getElementById('colorBeat');
                    beatElement.style.backgroundColor = beatColors[colorIndex];
                    beatElement.style.display = 'block';

                    setTimeout(() => {
                        beatElement.style.display = 'none';
                    }, 150);
                }
            }, 200);
        }

        function startScreenEffects() {
            const shakeFrequency = isMobile() ? 500 : 300;
            const colorShiftFrequency = isMobile() ? 1200 : 800;
            const floatingTextFrequency = isMobile() ? 2500 : 1500;

            setInterval(() => {
                if (animationRunning && Math.random() < (isMobile() ? 0.15 : 0.3)) {
                    shakeIntensity = isMobile() ? 1 + Math.random() * 1.5 : 2 + Math.random() * 3;
                    const shakeX = (Math.random() - 0.5) * shakeIntensity;
                    const shakeY = (Math.random() - 0.5) * shakeIntensity;
                    document.body.style.transform = `translate(${shakeX}px, ${shakeY}px)`;
                    
                    setTimeout(() => {
                        document.body.style.transform = 'translate(0, 0)';
                    }, 50);
                }
            }, shakeFrequency);

            const colorShifts = ['#1a1a1a', '#2a1a2a', '#1a2a2a', '#2a2a1a', '#2a1a1a'];
            setInterval(() => {
                if (animationRunning && Math.random() < 0.2) {
                    const randomColor = colorShifts[Math.floor(Math.random() * colorShifts.length)];
                    document.body.style.backgroundColor = randomColor;
                    setTimeout(() => {
                        document.body.style.backgroundColor = '#1a1a1a';
                    }, 200);
                }
            }, colorShiftFrequency);

            setInterval(() => {
                if (animationRunning && Math.random() < (isMobile() ? 0.2 : 0.4)) {
                    spawnFloatingText();
                }
            }, floatingTextFrequency);
        }

        function spawnFloatingText() {
            const text = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
            const element = document.createElement('div');
            element.className = 'floating-text';
            element.textContent = text;
            element.style.left = Math.random() * window.innerWidth + 'px';
            element.style.top = Math.random() * window.innerHeight + 'px';
            element.style.color = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff'][Math.floor(Math.random() * 4)];
            element.style.fontSize = isMobile() ? (12 + Math.random() * 10) + 'px' : (20 + Math.random() * 20) + 'px';
            element.style.transform = `rotate(${Math.random() * 360}deg)`;

            document.getElementById('backgroundLayer').appendChild(element);

            setTimeout(() => {
                element.remove();
            }, 3000);
        }

        function startVideoZoom(video) {
            const startWidth = isMobile() ? 320 : 640;
            const endWidth = window.innerWidth * (isMobile() ? 1.1 : 1.2);
            const startHeight = isMobile() ? 180 : 360;
            const endHeight = window.innerHeight * (isMobile() ? 1.1 : 1.2);

            const updateZoom = () => {
                const currentTime = video.currentTime;
                const duration = video.duration;
                
                if (duration && !isNaN(duration)) {
                    const progress = Math.min(currentTime / duration, 1);
                    
                    const currentWidth = startWidth + (endWidth - startWidth) * progress;
                    const currentHeight = startHeight + (endHeight - startHeight) * progress;
                    
                    const blur = isMobile() ? progress * 1.5 : progress * 3;
                    
                    const videoContainer = document.getElementById('videoContainer');
                    videoContainer.style.filter = `drop-shadow(0 0 ${20 + blur * 5}px rgba(139, 92, 246, 0.6)) blur(${blur * 0.1}px)`;
                    videoContainer.style.transform = `translate(-50%, -50%) scale(${1 + progress * 0.1})`;
                    
                    video.style.width = currentWidth + 'px';
                    video.style.height = currentHeight + 'px';
                }
                
                if (video.played && video.currentTime > 0 && video.currentTime < video.duration) {
                    requestAnimationFrame(updateZoom);
                }
            };

            video.addEventListener('playing', () => {
                updateZoom();
            });

            video.addEventListener('timeupdate', () => {
                updateZoom();
            });
        }

        function startBackgroundAnimation() {
            spawnCharacter();
            const spawnInterval = isMobile() ? 1200 : 600;
            setInterval(() => {
                if (activeCharacters.length < maxCharacters && animationRunning) {
                    spawnCharacter();
                }
            }, spawnInterval);

            let lastPhraseTime = 0;
            setInterval(() => {
                if (Math.random() < (isMobile() ? 0.15 : 0.3) && activeCharacters.length < maxCharacters && animationRunning) {
                    const now = Date.now();
                    if (now - lastPhraseTime > 3000) {
                        spawnPhrase();
                        lastPhraseTime = now;
                    }
                }
            }, 1000);

            const emojiInterval = isMobile() ? 4000 : 2000;
            setInterval(() => {
                if (Math.random() < (isMobile() ? 0.2 : 0.4) && animationRunning) {
                    spawnEmojiCharacter();
                }
            }, emojiInterval);

            updateAnimation();
        }

        function spawnEmojiCharacter() {
            const emoji = extraEmojis[Math.floor(Math.random() * extraEmojis.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.textContent = emoji;
            element.style.color = '#' + Math.floor(Math.random()*16777215).toString(16);
            element.style.fontSize = isMobile() ? (12 + Math.random() * 8) + 'px' : (16 + Math.random() * 12) + 'px';
            element.style.opacity = 0.6 + Math.random() * 0.4;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = isMobile() ? 0.2 + Math.random() * 1 : 0.5 + Math.random() * 2;

            const character = {
                element: element,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                isEmoji: true,
                lifetime: 8000
            };

            activeCharacters.push(character);
        }

        function spawnCharacter() {
            const dancer = asciiDancers[Math.floor(Math.random() * asciiDancers.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.style.color = dancer.color;
            element.style.fontSize = isMobile() ? (8 + Math.random() * 6) + 'px' : (12 + Math.random() * 8) + 'px';
            element.style.opacity = 0.5 + Math.random() * 0.5;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = isMobile() ? 0.2 + Math.random() * 0.8 : 0.5 + Math.random() * 1.5;
            
            let movementType = Math.floor(Math.random() * 7);
            let extraData = {};

            if (movementType === 6) {
                extraData.centerX = window.innerWidth * 0.5;
                extraData.centerY = window.innerHeight * 0.5;
                extraData.radius = 50 + Math.random() * 100;
                extraData.angle = Math.random() * Math.PI * 2;
            }

            const character = {
                element: element,
                dancer: dancer,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                frameIndex: 0,
                frameTimer: 0,
                frameInterval: 200 + Math.random() * 300,
                movementType: movementType,
                speed: speed,
                extraData: extraData
            };

            activeCharacters.push(character);
        }

        function spawnPhrase() {
            const phrase = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
            const element = document.createElement('div');
            element.className = 'ascii-character';
            element.style.color = '#a8dadc';
            element.style.fontSize = isMobile() ? (10 + Math.random() * 4) + 'px' : (14 + Math.random() * 6) + 'px';
            element.style.opacity = 0.4 + Math.random() * 0.3;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';
            element.textContent = phrase;

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = isMobile() ? 0.1 + Math.random() * 0.4 : 0.3 + Math.random() * 0.8;

            const character = {
                element: element,
                x: startX,
                y: startY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                isPhrase: true,
                lifetime: 15000
            };

            activeCharacters.push(character);
        }

        function updateAnimation() {
            const padding = 150;
            const toRemove = [];

            for (let i = 0; i < activeCharacters.length; i++) {
                const char = activeCharacters[i];

                if (char.isPhrase || char.isEmoji) {
                    char.lifetime -= 16;
                    if (char.lifetime <= 0) {
                        char.element.remove();
                        toRemove.push(i);
                        continue;
                    }
                    char.x += char.vx;
                    char.y += char.vy;
                } else {
                    char.frameTimer += 16;
                    if (char.frameTimer >= char.frameInterval) {
                        char.frameIndex = (char.frameIndex + 1) % char.dancer.frames.length;
                        char.element.textContent = char.dancer.frames[char.frameIndex];
                        char.frameTimer = 0;
                    }

                    if (char.movementType === 0) {
                        char.x += char.vx;
                        char.y += char.vy;
                    } else if (char.movementType === 1) {
                        char.y += char.speed;
                        if (Math.random() < 0.02) {
                            char.vx = (Math.random() - 0.5) * 2;
                        }
                        char.x += char.vx * 0.5;
                    } else if (char.movementType === 2) {
                        char.x += char.speed;
                        if (Math.random() < 0.03) {
                            char.vy = (Math.random() - 0.5) * 1.5;
                        }
                        char.y += char.vy;
                    } else if (char.movementType === 3) {
                        char.x += Math.sin(Date.now() * 0.002) * 2;
                        char.y += char.speed * 0.5;
                    } else if (char.movementType === 4) {
                        if (Math.random() < 0.05) {
                            char.vx = (Math.random() - 0.5) * 3;
                            char.vy = (Math.random() - 0.5) * 3;
                        }
                        char.x += char.vx;
                        char.y += char.vy;
                    } else if (char.movementType === 5) {
                        char.x += char.vx;
                        char.y += char.vy;
                        if (char.vy < 2) char.vy += 0.1;
                        if (char.y > window.innerHeight) {
                            char.vy = -Math.random() * 3;
                            char.y = window.innerHeight;
                        }
                    } else if (char.movementType === 6) {
                        char.extraData.angle += 0.05;
                        char.x = char.extraData.centerX + Math.cos(char.extraData.angle) * char.extraData.radius;
                        char.y = char.extraData.centerY + Math.sin(char.extraData.angle) * char.extraData.radius;
                    }

                    if (char.x < -padding || char.x > window.innerWidth + padding ||
                        char.y < -padding || char.y > window.innerHeight + padding) {
                        char.element.remove();
                        toRemove.push(i);
                        continue;
                    }
                }

                char.element.style.left = char.x + 'px';
                char.element.style.top = char.y + 'px';
            }

            for (let i = toRemove.length - 1; i >= 0; i--) {
                activeCharacters.splice(toRemove[i], 1);
            }

            if (animationRunning) {
                requestAnimationFrame(updateAnimation);
            }
        }
    </script>

</body>
</html>
