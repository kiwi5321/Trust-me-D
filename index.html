<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Are you sure?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100%; height: 100vh;
      background: #1a1a1a;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; font-family: 'Courier New', monospace;
      transition: background-color .12s;
    }

    #backgroundLayer {
      position: fixed; inset: 0;
      z-index: 1; pointer-events: none; overflow: hidden;
    }

    .ascii-character {
      position: absolute;
      font-family: 'Courier New', monospace;
      white-space: pre;
      user-select: none;
      line-height: 1.05;
      will-change: left, top, transform;
    }

    .floating-text {
      position: absolute;
      white-space: nowrap;
      font-family: 'Courier New', monospace;
      user-select: none;
      opacity: 0.95;
      z-index: 2;
      pointer-events: none;
      transform-origin: center;
    }

    #buttonContainer {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100; padding: 20px;
    }

    /* restored big responsive Trust Me button */
    .trust-btn {
      background: #8b5cf6;
      color: white;
      border: 4px solid white;
      padding: clamp(12px, 4vw, 18px) clamp(24px, 8vw, 40px);
      font-family: 'Courier New', monospace;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: bold;
      border-radius: 0;
      cursor: pointer;
      box-shadow: 6px 6px 0 #4c1d95;
      transition: all 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .trust-btn:hover { transform: translate(3px,3px); box-shadow: 3px 3px 0 #4c1d95; }
    .trust-btn:active { transform: translate(6px,6px); box-shadow: 0 0 0 #4c1d95; }

    #videoContainer {
      position: fixed; top: 50%; left: 50%;
      z-index: 50; display: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 20px rgba(139,92,246,.6));
      padding: 10px; max-width: 95vw; max-height: 95vh;
    }

    #prankVideo {
      width: 100%; height: auto;
      border: 3px solid #8b5cf6; border-radius: 4px;
      display: block;
    }

    #endScreen {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100; display: none; text-align: center;
      background: rgba(26,26,26,0.95);
      padding: 36px; border: 3px solid #8b5cf6; border-radius: 6px;
      max-width: 90vw; max-height: 90vh; overflow-y: auto;
    }

    #endScreen h1 { font-size: clamp(20px, 6vw, 36px); color: #ffd93d; margin-bottom: 12px; }
    #cookieArt { font-family: 'Courier New', monospace; color: #d4a574; white-space: pre; margin: 12px 0; line-height: 1.05; }
    #endScreen p { color: #a8dadc; margin-top: 10px; }

    /* full-screen beat color layer */
    #colorBeat {
      position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none;
      transition: background-color .09s linear;
    }

    @media (max-width: 768px) {
      .floating-text { font-size: clamp(12px, 3.5vw, 18px); }
      .ascii-character { font-size: clamp(10px, 3.2vw, 14px) !important; }
      body { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div id="backgroundLayer"></div>
  <div id="colorBeat"></div>

  <div id="buttonContainer">
    <button class="trust-btn" id="startBtn">TRUST ME</button>
  </div>

  <div id="videoContainer">
    <video id="prankVideo" loop playsinline>
      <source src="./HEYYEYAAEYAAAEYAEYAA%20(HQ)(3).mp4" type="video/mp4">
    </video>
  </div>

  <div id="endScreen">
    <h1>You watched till the end!</h1>
    <div id="cookieArt"></div>
    <p id="endText">Here's a cookie for watching till the end</p>
  </div>

  <script>
    // cookie ASCII art
    const cookieASCII = `
         .-""""-.
       .'  .--.  '.
      /  .'.--.'.  \\
     |  / /    \\ \\  |
     ; |  |    |  | ;
     | |  |    |  | |
     ; |  '.__.'  | ;
      \\ \\        / /
       '.'.____.'.'
         '-.____.-'
    `;

    // phrases and dancers
    const floatingPhrases = ['HEYYEYAAEYAAAEYAEYAA', "What's going on?", 'WAIT','WHY','NOPE','HELP'];

    const asciiDancers = [
      ['  O\n /|\\\n / \\'],
      [' ┌( ಠ_ಠ )┘',' └( ಠ_ಠ )┐'],
      ['╰(°∇≦*)╮','╭(°∇≦*)╰'],
      ['(づ｡◕‿‿◕｡)づ'],
      ['(ง •̀_•́)ง'],
      ['(ノಠ益ಠ)ノ']
    ];

    // state
    const isMobile = () => window.innerWidth <= 768;
    let activeCharacters = [];
    let animationRunning = false;
    let rafId = null;
    let spawnIntervalId = null;

    // audio/beat (for background color only)
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let runningAvg = 0;
    let lastPeak = 0;

    // constants for motion + collision avoidance
    const MAX_CHAR = () => isMobile() ? 10 : 20;
    const SEPARATION = 46;      // desired minimum distance in px
    const MAX_SPEED = 1.2;      // px per frame (approx)
    const MAX_FORCE = 0.06;     // steering strength

    // init end screen cookie
    document.getElementById('cookieArt').textContent = cookieASCII;
    document.getElementById('endText').textContent = "Here's a cookie for watching till the end";

    // start button
    document.getElementById('startBtn').addEventListener('click', async () => {
      const container = document.getElementById('buttonContainer');
      container.style.display = 'none';
      container.style.pointerEvents = 'none';

      const videoContainer = document.getElementById('videoContainer');
      videoContainer.style.display = 'block';
      const video = document.getElementById('prankVideo');

      animationRunning = true;
      startBackground();
      startScreenEffects(); // color pulse controlled by audio
      startVideoZoom(video);

      // init audio for beat-driven background (not for characters)
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const src = audioContext.createMediaElementAudioSource(video);
        src.connect(analyser);
        analyser.connect(audioContext.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        if (audioContext.state === 'suspended') await audioContext.resume();
        startBeatDetection();
      } catch (e) {
        // fallback: simulated beat pulses
        startBeatFallback();
      }

      video.play().catch(e => console.warn('video play prevented', e));
      video.addEventListener('ended', () => {
        showEndScreen();
        // close audio context optionally
        if (audioContext && audioContext.state !== 'closed') audioContext.close().catch(()=>{});
      }, { once: true });
    });

    function showEndScreen() {
      animationRunning = false;
      if (spawnIntervalId) clearInterval(spawnIntervalId);
      if (rafId) cancelAnimationFrame(rafId);
      document.getElementById('videoContainer').style.display = 'none';
      document.getElementById('endScreen').style.display = 'block';
      document.getElementById('cookieArt').textContent = cookieASCII;
      // hide beat color layer for clarity
      document.getElementById('colorBeat').style.display = 'none';
    }

    // spawn + animation
    function startBackground() {
      // spawn initial characters
      const initial = Math.min(6, MAX_CHAR());
      for (let i = 0; i < initial; i++) spawnCharacter();

      // spawn rate-limited
      spawnIntervalId = setInterval(() => {
        if (!animationRunning) return;
        if (activeCharacters.length < MAX_CHAR()) spawnCharacter();
      }, isMobile() ? 900 : 650);

      // single RAF loop
      rafId = requestAnimationFrame(loop);
    }

    function spawnCharacter() {
      const frames = asciiDancers[Math.floor(Math.random() * asciiDancers.length)];
      const el = document.createElement('div');
      el.className = 'ascii-character';
      el.style.color = '#a8dadc';
      const fontSize = isMobile() ? (10 + Math.random() * 6) : (12 + Math.random() * 8);
      el.style.fontSize = fontSize + 'px';
      el.style.opacity = 0.92;
      el.textContent = frames[Math.floor(Math.random() * frames.length)];

      const margin = 30;
      const w = Math.max(200, window.innerWidth - margin * 2);
      const h = Math.max(200, window.innerHeight - margin * 2);
      const x = margin + Math.random() * w;
      const y = margin + Math.random() * h;

      el.style.left = Math.round(x) + 'px';
      el.style.top = Math.round(y) + 'px';
      document.getElementById('backgroundLayer').appendChild(el);

      // motion state
      const baseY = y;
      const offset = Math.random() * 1000;
      const bobFreq = 0.9 + Math.random() * 0.7; // bob frequency
      const bobAmp = 2 + Math.random() * 6;      // bob amplitude
      const vx = (Math.random() - 0.5) * 0.6;    // initial small velocity
      const vy = (Math.random() - 0.5) * 0.4;

      const radius = Math.max(14, fontSize * 1.2); // approximate radius for collision

      activeCharacters.push({
        element: el,
        frames,
        frameIndex: 0,
        frameTimer: 0,
        frameInterval: 380 + Math.random() * 240,
        x, y, vx, vy, ax: 0, ay: 0,
        baseY, offset, bobFreq, bobAmp, radius,
        life: 30000 // optional removal guard
      });
    }

    // floating text
    function spawnFloatingText() {
      const txt = floatingPhrases[Math.floor(Math.random() * floatingPhrases.length)];
      const el = document.createElement('div');
      el.className = 'floating-text';
      el.textContent = txt;
      const left = 12 + Math.random() * (window.innerWidth - 120);
      const top = 40 + Math.random() * (window.innerHeight - 120);
      el.style.left = Math.round(left) + 'px';
      el.style.top = Math.round(top) + 'px';
      el.style.color = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff'][Math.floor(Math.random() * 4)];
      el.style.fontSize = isMobile() ? (12 + Math.random() * 8) + 'px' : (14 + Math.random() * 12) + 'px';
      document.getElementById('backgroundLayer').appendChild(el);
      el.animate([
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-80px)', opacity: 0 }
      ], { duration: 2800, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => el.remove();
    }

    // single RAF loop with collision avoidance (simple separation steering)
    function loop(now) {
      // update frames & movement
      const n = activeCharacters.length;
      // reset accelerations
      for (let i = 0; i < n; i++) {
        activeCharacters[i].ax = 0;
        activeCharacters[i].ay = 0;
      }

      // separation steering: O(N^2) but N small (<= 20)
      for (let i = 0; i < n; i++) {
        const a = activeCharacters[i];
        for (let j = i + 1; j < n; j++) {
          const b = activeCharacters[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist = Math.hypot(dx, dy) || 0.0001;
          const minDist = (a.radius + b.radius) * 0.6; // desired clearance
          if (dist < minDist && dist > 0) {
            // compute repulsion force magnitude proportional to overlap
            const overlap = (minDist - dist) / minDist;
            const force = Math.min(MAX_FORCE, overlap * 0.12);
            const nx = dx / dist;
            const ny = dy / dist;
            // apply half to each (push them apart)
            a.ax += nx * force;
            a.ay += ny * force;
            b.ax -= nx * force;
            b.ay -= ny * force;
          }
        }
      }

      // update each character with bob + wander + steering
      for (let i = n - 1; i >= 0; i--) {
        const c = activeCharacters[i];
        // animation frame (independent)
        c.frameTimer += 16;
        if (c.frameTimer >= c.frameInterval) {
          c.frameIndex = (c.frameIndex + 1) % c.frames.length;
          c.element.textContent = c.frames[c.frameIndex];
          c.frameTimer = 0;
        }

        // gentle autonomous wander force (small random jitter)
        const jitterStrength = 0.006;
        c.ax += (Math.random() - 0.5) * jitterStrength;
        c.ay += (Math.random() - 0.5) * jitterStrength;

        // update velocity
        c.vx += c.ax;
        c.vy += c.ay;

        // limit speed
        const speed = Math.hypot(c.vx, c.vy);
        if (speed > MAX_SPEED) {
          const s = MAX_SPEED / speed;
          c.vx *= s;
          c.vy *= s;
        }

        // update position
        c.x += c.vx;
        c.y += c.vy;

        // add independent bob (NOT beat-synced)
        const t = (now + c.offset) * 0.001;
        c.y = c.y + Math.sin(t * c.bobFreq) * (c.bobAmp * 0.04); // subtle using small multiplier

        // keep inside viewport with gentle steering
        const padding = 20;
        if (c.x < padding) { c.vx += 0.12; c.x = Math.max(c.x, padding); }
        if (c.x > window.innerWidth - padding) { c.vx -= 0.12; c.x = Math.min(c.x, window.innerWidth - padding); }
        if (c.y < padding) { c.vy += 0.12; c.y = Math.max(c.y, padding); }
        if (c.y > window.innerHeight - padding) { c.vy -= 0.12; c.y = Math.min(c.y, window.innerHeight - padding); }

        // life guard (remove if off or old)
        c.life -= 16;
        if (c.life <= 0) {
          if (c.element && c.element.remove) c.element.remove();
          activeCharacters.splice(i, 1);
          continue;
        }

        // apply position to DOM
        c.element.style.left = Math.round(c.x) + 'px';
        c.element.style.top = Math.round(c.y) + 'px';
        // reset small velocities slowly
        c.vx *= 0.995;
        c.vy *= 0.995;
      }

      // occasionally spawn floating text (readable)
      if (animationRunning && Math.random() < 0.01 && activeCharacters.length < MAX_CHAR()) spawnFloatingText();

      rafId = requestAnimationFrame(loop);
    }

    // SCREEN/VIDEO zoom (unchanged, independent)
    function startVideoZoom(video){
      function update(){
        if (!video || video.paused || video.ended) return;
        const dur = video.duration;
        if (dur && !isNaN(dur)) {
          const p = Math.min(1, video.currentTime / dur);
          const s = 1 + p * 0.03;
          document.getElementById('videoContainer').style.transform = `translate(-50%, -50%) scale(${s})`;
        }
        requestAnimationFrame(update);
      }
      video.addEventListener('playing', () => requestAnimationFrame(update));
    }

    // AUDIO beat detection for background color only
    function startBeatDetection(){
      const beatLayer = document.getElementById('colorBeat');
      beatLayer.style.display = 'block';
      function detect(){
        if (!analyser || !animationRunning) return;
        analyser.getByteFrequencyData(dataArray);
        // calculate energy (avg)
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const instant = sum / dataArray.length / 255; // 0..1
        runningAvg = 0.92 * runningAvg + 0.08 * instant;
        const diff = Math.max(0, instant - runningAvg);
        const now = performance.now();
        // decide a small beatIntensity used only to pick color
        const intensity = Math.min(1, instant * 1.6);
        // colors palette
        const colors = [
          'rgba(255, 100, 100, OP)',
          'rgba(100, 255, 150, OP)',
          'rgba(100, 150, 255, OP)',
          'rgba(255, 225, 110, OP)',
          'rgba(200, 100, 255, OP)'
        ];
        // pick index based on intensity
        const idx = Math.floor(intensity * (colors.length - 1));
        // if a peak occurs, pulse (diff threshold)
        if (diff > 0.06 && now - lastPeak > 120) {
          lastPeak = now;
          // pulse stronger and briefly
          beatLayer.style.backgroundColor = colors[idx].replace('OP', 0.18 + intensity * 0.25);
          setTimeout(()=>{ if (animationRunning) beatLayer.style.backgroundColor = colors[idx].replace('OP', 0.06); }, 120);
        } else {
          // subtle steady background
          beatLayer.style.backgroundColor = colors[idx].replace('OP', 0.04 + intensity * 0.02);
        }

        requestAnimationFrame(detect);
      }
      detect();
    }

    // fallback if audio not available
    function startBeatFallback(){
      const beatLayer = document.getElementById('colorBeat');
      beatLayer.style.display = 'block';
      setInterval(()=>{
        if (!animationRunning) return;
        const intensity = Math.random() * 0.8;
        const colors = ['rgba(255,100,100,OP)','rgba(100,255,150,OP)','rgba(100,150,255,OP)','rgba(255,225,110,OP)','rgba(200,100,255,OP)'];
        const idx = Math.floor(intensity * (colors.length - 1));
        beatLayer.style.backgroundColor = colors[idx].replace('OP', 0.06 + intensity * 0.12);
        setTimeout(()=>{ if (animationRunning) beatLayer.style.backgroundColor = colors[idx].replace('OP', 0.02); }, 120);
      }, 240);
    }

    // resize handling: cap characters so performance stays stable
    window.addEventListener('resize', () => {
      const maxNow = MAX_CHAR();
      while (activeCharacters.length > maxNow) {
        const ch = activeCharacters.pop();
        if (ch && ch.element) ch.element.remove();
      }
    });
  </script>
</body>
</html>
