<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are you sure?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #backgroundLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-text {
            position: absolute;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #8b5cf6;
            opacity: 0.6;
            user-select: none;
        }

        #dancingCharacter {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #8b5cf6;
            white-space: pre;
            z-index: 2;
            line-height: 1.2;
        }

        #buttonContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .trust-btn {
            background: #8b5cf6;
            color: white;
            border: 4px solid white;
            padding: 18px 40px;
            font-family: 'Courier New', monospace;
            font-size: 28px;
            font-weight: bold;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 6px 6px 0 #4c1d95;
            transition: all 0.1s ease;
        }

        .trust-btn:hover {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0 #4c1d95;
        }

        .trust-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0 0 0 #4c1d95;
        }

        #videoContainer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
            max-width: 90vw;
            max-height: 90vh;
        }

        #prankVideo {
            width: 100%;
            height: auto;
            max-width: 640px;
            max-height: 360px;
            aspect-ratio: 16 / 9;
            display: block;
            border: 4px solid #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }

        @media (max-width: 768px) {
            #prankVideo {
                max-width: 480px;
                max-height: 270px;
            }
        }

        @media (max-width: 480px) {
            #prankVideo {
                max-width: 360px;
                max-height: 202px;
            }
        }
    </style>
</head>
<body>

    <div id="backgroundLayer"></div>

    <div id="dancingCharacter"></div>

    <div id="buttonContainer">
        <button class="trust-btn" onclick="startPrank()">TRUST ME</button>
    </div>

    <div id="videoContainer">
        <video id="prankVideo" loop playsinline>
            <source src="./ez.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const floatingTexts = [
            'HEYYEYAAEYAAAEYAEYAA',
            "What's going on?",
            '┌( ಠ_ಠ )┘',
            '╰(°∇≦*)╮',
            'bruh',
            'WHAT',
            'why',
            'hello???',
            'ಠ_ಠ',
            '(•_•)',
            '(╯°□°）╯︵ ┻━┻',
            '┬─┬ ノ( ゜-゜ノ)',
            'sus',
            '???',
            'lol',
            'XD',
            '(´ ▽`)',
            '(°_°)',
            'WAIT',
            'NO'
        ];

        const dancingFrames = [
            '  O\n /|\\\n / \\',
            ' \\O\n  |\\\n / \\',
            '  O/\n  |\n / \\',
            'O\n/|\\\n / \\',
            '  O\n /|\\\n/ \\',
            '  O\n /|\\\n \\ /',
            ' O/\n ||\n/ \\',
            '  O\n /|\\\n / \\'
        ];

        let frameIndex = 0;
        let activeFloatingElements = [];
        const maxFloatingElements = 15;

        function startPrank() {
            document.getElementById('buttonContainer').style.display = 'none';
            document.getElementById('videoContainer').style.display = 'block';
            const video = document.getElementById('prankVideo');
            video.play().catch(error => {
                console.error('Playback failed:', error);
            });
            startBackgroundAnimation();
        }

        function startBackgroundAnimation() {
            setInterval(spawnFloatingText, 800);
            setInterval(updateDancingCharacter, 200);
            moveDancingCharacter();
        }

        function spawnFloatingText() {
            if (activeFloatingElements.length >= maxFloatingElements) {
                const oldElement = activeFloatingElements.shift();
                oldElement.remove();
            }

            const text = floatingTexts[Math.floor(Math.random() * floatingTexts.length)];
            const element = document.createElement('div');
            element.className = 'floating-text';
            element.textContent = text;

            const startX = Math.random() * window.innerWidth;
            const startY = Math.random() * window.innerHeight;
            element.style.left = startX + 'px';
            element.style.top = startY + 'px';

            const opacity = 0.3 + Math.random() * 0.4;
            element.style.opacity = opacity;

            const fontSize = 14 + Math.random() * 24;
            element.style.fontSize = fontSize + 'px';

            const rotation = Math.random() * 45 - 22.5;
            element.style.transform = `rotate(${rotation}deg)`;

            document.getElementById('backgroundLayer').appendChild(element);

            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;

            const data = {
                element: element,
                x: startX,
                y: startY,
                vx: vx,
                vy: vy
            };

            activeFloatingElements.push(data);
        }

        function updateFloatingPosition() {
            const padding = 100;
            const toRemove = [];

            for (let i = 0; i < activeFloatingElements.length; i++) {
                const data = activeFloatingElements[i];
                data.x += data.vx;
                data.y += data.vy;

                data.element.style.left = data.x + 'px';
                data.element.style.top = data.y + 'px';

                if (data.x < -padding || data.x > window.innerWidth + padding ||
                    data.y < -padding || data.y > window.innerHeight + padding) {
                    data.element.remove();
                    toRemove.push(i);
                }
            }

            for (let i = toRemove.length - 1; i >= 0; i--) {
                activeFloatingElements.splice(toRemove[i], 1);
            }
        }

        function updateDancingCharacter() {
            const character = document.getElementById('dancingCharacter');
            character.textContent = dancingFrames[frameIndex];
            frameIndex = (frameIndex + 1) % dancingFrames.length;
        }

        function moveDancingCharacter() {
            const character = document.getElementById('dancingCharacter');
            let x = window.innerWidth * 0.15;
            let y = window.innerHeight * 0.2;
            let dirX = 1;
            let dirY = 1;

            setInterval(() => {
                x += dirX * 2;
                y += dirY * 2;

                if (x < window.innerWidth * 0.05 || x > window.innerWidth * 0.25) {
                    dirX *= -1;
                }
                if (y < window.innerHeight * 0.1 || y > window.innerHeight * 0.4) {
                    dirY *= -1;
                }

                character.style.left = x + 'px';
                character.style.top = y + 'px';
            }, 300);
        }

        setInterval(updateFloatingPosition, 30);
    </script>

</body>
</html>
